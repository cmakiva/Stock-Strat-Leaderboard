name: Daily update

on:
  schedule:
    # 22:30 UTC on weekdays: after the 4:00 pm ET close year-round (6:30 pm EDT / 5:30 pm EST).
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab
  push:
    branches: [main]

env:
  # The site's public address. When the custom domain is ready, change this one line.
  SITE_URL: https://cmakiva.github.io/Stock-Strat-Leaderboard

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: pip install -r requirements.txt

      - name: Test the backtest engine and page builder
        run: |
          python -m pytest -q tests
          node --test tests/*.test.mjs

      - name: Fetch SPY data and backtest all strategies
        run: python engine/build.py --provider yahoo --out site/data/results.json

      - name: Write a page for each strategy, plus sitemap and robots.txt
        run: node engine/prerender.mjs --site site --out dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Only runs if the build succeeded, so a failed data fetch leaves yesterday's site up.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
